name: Release Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Linux Gate
        run: ./scripts/linux-gate.sh
      - name: Linux Reliability Drill
        run: python scripts/reliability-drill.py --monitor-cycles 40 --firewall-cycles 8 --output .artifacts/linux-reliability.json
      - name: Upload Linux Reliability Evidence
        uses: actions/upload-artifact@v7
        with:
          name: linux-reliability
          path: .artifacts/linux-reliability.json

  gate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Windows Gate
        shell: pwsh
        run: ./scripts/windows-gate.ps1
      - name: Windows Reliability Drill
        run: python scripts/reliability-drill.py --monitor-cycles 40 --firewall-cycles 8 --output .artifacts/windows-reliability.json
      - name: Upload Windows Reliability Evidence
        uses: actions/upload-artifact@v7
        with:
          name: windows-reliability
          path: .artifacts/windows-reliability.json
