name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure security policy files exist
        run: |
          test -f SECURITY.md
          test -f .github/SECURITY.md
          test -f docs/security.md
          test -f docs/threat-model.md
          test -f docs/security-evidence/control-mapping.md
          test -f docs/security-evidence/data-flow.md
          test -f docs/security-evidence/threat-model.md
