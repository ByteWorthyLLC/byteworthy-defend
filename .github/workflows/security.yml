name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure security policy files exist
        run: |
          test -f SECURITY.md
          test -f .github/SECURITY.md
          test -f docs/security.md
          test -f docs/threat-model.md
          test -f docs/security-evidence/control-mapping.md
          test -f docs/security-evidence/data-flow.md
          test -f docs/security-evidence/threat-model.md
          test -f docs/security-evidence/supply-chain.md
          test -f docs/security-evidence/dependency-audit.md
          test -f docs/security-evidence/windows-validation.md
          test -f docs/security-evidence/independent-security-review.md

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Skylos SAST/SCA Gate
        run: skylos src --all --gate --no-upload

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ai]' pip-audit
      - name: Run pip-audit
        run: |
          pip-audit --progress-spinner off --format json --output pip-audit.json || true
          python scripts/dependency-audit-policy.py pip-audit.json
      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
