[pytest]
# Pytest configuration for HifzDefend test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components (fast, isolated)
    integration: Integration tests for component interactions (slower)
    benchmark: Performance benchmark tests (slowest, resource-intensive)
    slow: Slow-running tests (excluded by default)
    asyncio: Tests that use asyncio
    requires_admin: Tests requiring administrator privileges (Windows)
    requires_docker: Tests requiring Docker to be running
    requires_api_keys: Tests requiring external API keys

# Asyncio mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --cov=src/hifzdefend
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Coverage options
[coverage:run]
source = src/hifzdefend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 85

[coverage:html]
directory = htmlcov
