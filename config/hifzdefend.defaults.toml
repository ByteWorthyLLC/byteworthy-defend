# HifzDefend Default Configuration
# This file contains the default configuration values for HifzDefend.
# Copy this to %LOCALAPPDATA%\HifzDefend\hifzdefend.toml to customize.

[clamav]
# ClamAV daemon connection settings
host = "localhost"
port = 3310
timeout = 60

[scanning]
# Maximum file size to scan (bytes) - default 100 MB
max_file_size = 104857600

# Scan compressed archives (zip, tar, etc.)
scan_archives = true

# Recursively scan directories
scan_recursively = true

# Follow symbolic links during scanning
follow_symlinks = false

# Paths to exclude from scanning (Windows system directories)
excluded_paths = [
    "C:\\Windows\\System32",
    "C:\\Windows\\SysWOW64",
    "C:\\Windows\\WinSxS",
    "C:\\Program Files\\Windows Defender",
]

# File extensions to exclude from scanning
excluded_extensions = [".log", ".tmp", ".temp"]

[monitoring]
# Real-time file system monitoring (Phase 2)
enabled = false

# Directories to monitor for changes
watch_paths = []

# Scan files when created
scan_on_create = true

# Scan files when modified
scan_on_modify = false

[logging]
# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = "INFO"

# Log directory (supports %LOCALAPPDATA% and other env vars)
log_dir = "%LOCALAPPDATA%\\HifzDefend\\logs"

# Maximum log file size (bytes) - default 10 MB
max_log_size = 10485760

# Number of backup log files to keep
backup_count = 5

# Log format (json or text)
format = "json"

[reporting]
# Report output directory
report_dir = "%LOCALAPPDATA%\\HifzDefend\\reports"

# Save reports for clean scans (no threats found)
save_clean_scans = false

# Report format (json, html, text)
report_format = "json"

[quarantine]
# Enable quarantine functionality
enabled = true

# Quarantine directory
quarantine_dir = "%LOCALAPPDATA%\\HifzDefend\\quarantine"

# Automatically quarantine detected threats
auto_quarantine = true
