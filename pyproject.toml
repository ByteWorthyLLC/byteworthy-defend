[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hifzdefend"
version = "0.3.0"
description = "HifzDefend - Custom Windows Antivirus Solution Based on ClamAV"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HifzDefend Team", email = "contact@hifzdefend.local"}
]
keywords = ["antivirus", "security", "clamav", "malware", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

dependencies = [
    # Core dependencies (Phase 1)
    "clamd>=1.0.2",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-json-logger>=2.0.0",
    "watchdog>=3.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "python-dateutil>=2.8.0",
    # Phase 1.5: Advanced threat detection dependencies
    "yara-python>=4.5.0",           # Custom signature engine
    "scapy>=2.5.0",                 # Network packet analysis
    "docker>=7.0.0",                # Docker API client
    "requests>=2.31.0",             # HTTP requests (threat intel APIs)
    "dnspython>=2.4.0",             # DNS monitoring
    "pynput>=1.7.6",                # Input device monitoring
    "opencv-python>=4.8.0",         # Webcam detection
    # "pyaudio>=0.2.14",            # Microphone detection (OPTIONAL - requires PortAudio C library)
    "cryptography>=41.0.0",         # Signature verification
    "aiohttp>=3.9.0",               # Async HTTP client
    "python-registry>=1.3.1",       # Windows Registry access
    "wmi>=1.5.1; platform_system=='Windows'",  # Windows Management Instrumentation
    "pywin32>=306; platform_system=='Windows'",  # Windows API access
    # Phase 2: AI Integration dependencies
    "anthropic>=0.40.0",            # Claude API client
    "chromadb>=0.4.0",              # Vector database for RAG
    "sentence-transformers>=2.2.0", # Text embeddings
    # Phase 3: Commercial features
    "stripe>=7.0.0",                # Payment processing
    "pyjwt>=2.8.0",                 # JWT tokens for authentication
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",      # Async test support
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
    "pip-audit>=2.6.0",
    "bandit>=1.7.5",
]

[project.scripts]
hifzdefend = "hifzdefend.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/hifzdefend"
Documentation = "https://github.com/yourusername/hifzdefend#readme"
Repository = "https://github.com/yourusername/hifzdefend"
Issues = "https://github.com/yourusername/hifzdefend/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hifzdefend*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | clamav
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "clamav",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit security
]
ignore = [
    "E501",  # line too long (handled by black)
    "S101",  # use of assert (needed for tests)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
exclude = [
    "clamav/",
    ".venv/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "clamd.*",
    "watchdog.*",
    "yara.*",
    "scapy.*",
    "docker.*",
    "pynput.*",
    "cv2.*",
    "pyaudio.*",
    "Registry.*",
    "wmi.*",
    "win32evtlog.*",
    "win32api.*",
    "win32security.*",
    "win32con.*",
    "chromadb.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=hifzdefend",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_clamav: marks tests that require ClamAV daemon running",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/clamav/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
