[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "byteworthy-defend"
version = "0.1.0"
description = "Linux-first terminal antivirus with core and AI editions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ByteWorthy LLC", email = "support@byteworthy.io" }
]
keywords = ["antivirus", "security", "linux", "cli", "endpoint-security", "malware"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
ai = [
  "openai>=1.40.0"
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0"
]

[project.scripts]
bw-defend = "bw_defend.cli.main:run"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
